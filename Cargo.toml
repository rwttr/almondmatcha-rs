# almondmatcha — Rust rover workspace
#
# Host binaries and MCU firmware share one workspace and one message crate,
# so a wire-layout disagreement between the RPi and an STM32 is a compile
# error here, not a HardFault in a field.
#
# Firmware crates live in firmware/ and are NOT members of this workspace:
# they build for thumbv7em-none-eabihf with their own profile and linker
# settings, and a workspace cannot hold two different default targets.
# They depend on rover-msgs by path.

[workspace]
resolver = "2"
members = [
    "crates/rover-msgs",
    "crates/rover-link",
    "crates/rover-bus",
    "crates/rover-model",
    "crates/rover-estimator",
    "crates/rover-tap",
    "crates/rover-control",
    "crates/rover-navigation",
    "crates/rover-runs",
    "crates/rover-telemetry",
    "crates/ground-station",
    "crates/rover-doctor",
    "tools/replay",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/RoboticsGG/almondmatcha"

[workspace.dependencies]
rover-msgs      = { path = "crates/rover-msgs" }
rover-link      = { path = "crates/rover-link" }
rover-bus       = { path = "crates/rover-bus" }
rover-model     = { path = "crates/rover-model" }
rover-estimator = { path = "crates/rover-estimator" }
rover-control   = { path = "crates/rover-control" }
rover-runs      = { path = "crates/rover-runs" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
