# almondmatcha — single source of truth for the whole system.
#
# Every host binary reads this at startup. The two firmware images do not:
# that would need a const-fn TOML parser (include_str! + parse at compile
# time), which was deliberately not built for this pass (see
# docs/RUST_REWRITE_PLAN.md §13.3 item 2) — getting a hand-rolled parser
# subtly wrong was judged worse than a small, obviously-named constants file
# a human can diff by eye. Instead the firmware constants are HAND-TRANSCRIBED
# into each crate's config.rs, with every constant citing the rover.toml key
# it came from. If you change a value here, grep both firmware/*/src/config.rs
# for the old value and update it there too — that manual step is real and is
# the documented cost of not having the parser yet.
#
# Nothing here may be duplicated in code. If a constant appears in both a
# source file and this file, this file is wrong or the source file is.

# ---------------------------------------------------------------------------
# Services. Static IPs on a private wired LAN; there is no discovery anywhere
# in this system, by design.
#
# Design defect D1 (docs/RUST_REWRITE_PLAN.md §13.3b): this used to be
# [hosts] (name -> IP) plus [ports] (name -> one UDP port), giving each
# *host* exactly one port. The RPi runs three separate receiving processes —
# rover-control, rover-navigation, rover-telemetry — which all bound the same
# "rpi" port and collided (`EADDRINUSE`) on real hardware; nothing caught it
# because nothing had run on hardware yet. The bus routes to *processes*, not
# machines, so this table names one full `host:port` per process instead.
# Three of these (control/navigation/telemetry) share the RPi's IP but have
# distinct ports; the rest are one process per machine, same as before.
# ---------------------------------------------------------------------------
[services]
control    = "192.168.1.1:7001"
navigation = "192.168.1.1:7002"
telemetry  = "192.168.1.1:7003"
chassis    = "192.168.1.2:7010"
sensors    = "192.168.1.6:7011"
perception = "192.168.1.5:7020"
base       = "192.168.1.10:7030"

# ---------------------------------------------------------------------------
# Routing: which services receive each message type.
#
# Unicast fan-out from a static table, NOT multicast. With seven services and
# sub-200-byte messages the duplication costs nothing, and it removes the IGMP
# dependency that forced a hand-maintained initialPeersList in the ROS 2 system.
#
# A type may name several destinations — worked out from what each binary
# actually subscribes to (`rover-*/src/main.rs`), not guessed. A type absent
# from this table (`MagSample`, `MotionSetpoint`, `EkfDebug`) has no current
# subscriber; publishing it still costs nothing (`Bus::publish` treats an
# unrouted type as "no destinations", not an error — see `rover-bus`), and it
# still reaches `[debug] mirror` when that is set. Add a destination here the
# day something actually consumes one of them.
# ---------------------------------------------------------------------------
# Optional firehose mirror for debugging.
#
# Unicast fan-out means a passive tap only sees traffic addressed to the
# service it binds as, and cannot co-bind with a real listener on the same
# port — see `rover-tap`'s own doc comment. That is inherent to unicast, not
# a bug.
#
# When `mirror` is set, every published frame is additionally sent there, so
# one rover-tap sees the whole bus from anywhere on the LAN. Costs one extra
# datagram per message — negligible at these rates, but leave it empty for
# field runs so nothing depends on a laptop being present.
[debug]
mirror = ""                   # e.g. "192.168.1.100:7099"

[routes]
# ImuSample/WheelSensors/LaneMeasurement feed the estimator and speed loop,
# both in rover-control.
ImuSample       = ["control"]
ChassisStatus   = ["telemetry"]
ChassisCommand  = ["chassis"]
WheelSensors    = ["control"]
PowerSample     = ["telemetry"]
# rover-telemetry fills Telemetry::rtk/backup from this; rover-control does
# not subscribe to it (navigation already resolved rtk-vs-backup upstream).
GnssFix         = ["telemetry"]
LaneMeasurement = ["control"]
RoverState      = ["telemetry"]
# rover-control gates driving on MissionStatus.active; rover-telemetry logs
# and relays it in Telemetry::mission.
MissionStatus   = ["control", "telemetry"]
# Also to "sensors": that board publishes only, so it has no command stream
# to time out on. Telemetry is its liveness heartbeat — without it its mirror
# watchdog (plan §5.2) would read as permanently tripped, which is exactly the
# false alarm that teaches people to ignore a warning LED.
Telemetry       = ["base", "sensors"]
# Every process that runs its own rover_bus::CommandReceiver needs the same
# CommandFrame stream: rover-control (applies Command to the safety gate /
# speed limit), rover-navigation (mission state machine), and rover-telemetry
# (its own last_cmd_seq bookkeeping — see its main.rs doc comment).
CommandFrame    = ["control", "navigation", "telemetry"]
SpeedLoopDebug  = ["telemetry"]
# Both destinations read this directly: rover-telemetry logs it to
# board_diagnostics.csv and folds it into Telemetry::health (BOARD_POST_FAIL /
# BOARD_RESET / LINK_DEGRADED), and the base station's preflight tool
# (rover-doctor) reads it straight off the wire to judge POST/reset/link
# checks before anyone drives -- it does not wait for rover-telemetry to
# relay a verdict.
BoardDiagnostics = ["telemetry", "base"]

# ---------------------------------------------------------------------------
# Drivetrain
#
# ⚠️  NOT YET CALIBRATED. The ROS 2 system had no metric speed anywhere and no
#     record of encoder counts per revolution. Run both procedures in
#     docs/CALIBRATION.md before trusting speed_mps — docs/RUST_REWRITE_PLAN.md
#     §2.6 has the reasoning behind them.
#
# ⚠️  `decoding` MUST match the firmware. The mbed firmware attached interrupts
#     to channel A only (rise + fall), giving 2x counts. Hardware quadrature
#     timer mode gives 4x. Switching modes DOUBLES every tick count and halves
#     metres_per_tick. Calibrate after choosing, never before.
# ---------------------------------------------------------------------------
[drivetrain]
wheel_diameter_m = 0.125      # measured
decoding         = "quadrature_4x"
ticks_per_rev    = 0.0        # TODO: docs/CALIBRATION.md Procedure A
metres_per_tick  = 0.0        # TODO: docs/CALIBRATION.md Procedure B — authoritative
track_width_m    = 0.0        # TODO: measure; gives a second yaw-rate estimate
wheelbase_m      = 0.4875     # measured, carried over from the ROS 2 system

# ---------------------------------------------------------------------------
# Perception geometry. Carried over unchanged — these are camera-calibration
# facts, not tuning knobs.
# ---------------------------------------------------------------------------
[perception]
bev_px_per_m   = 200.0
lookahead_m    = 1.22         # ahead of the FRONT axle, set by the ROI geometry
frame_width    = 1280
frame_height   = 720
fps            = 30

# ---------------------------------------------------------------------------
# Lateral control.
#
# `law` selects the LateralController implementation. Start on "static_gain":
# it is the bit-exact port of the ROS 2 law and the parity baseline every other
# controller is measured against. Do not switch until replay shows parity.
# ---------------------------------------------------------------------------
[control]
law            = "static_gain"
steer_max_deg  = 45.0
steer_slew_deg_per_s = 180.0  # guard rail, applies to every law

[control.static_gain]
# Field-derived. A fixed LQR solution on the linearised error model, expressed
# in degrees because the ROS 2 law output degrees.
#
# These assume LOOKAHEAD-referenced errors. The EKF estimates at the front
# axle, so guidance must call RoverState::at_lookahead() before applying them —
# that is what keeps these values valid across the EMA -> EKF change.
k_lat  = 181.17               # deg per metre of lateral offset
k_head = 2.024                # deg per degree of heading error

# --- D5 note: these gains have never been run with a correctly-signed
# heading term (docs/RUST_REWRITE_PLAN.md §13.3b D5). Do NOT change the
# values above for this -- they are field-derived and must be ported
# bit-exactly (§10); tools/replay's gate proves the control law bit-exact
# against a frozen oracle, and retuning here would break that and
# substitute an invented number for a measured one. This comment only
# records why the closed-loop response changed and what to do about it.
#
# For a straight path angled psi degrees, with b at the 1.22 m lookahead
# ~= l_a * psi:
#   k_lat contributes  181.17 deg/m * 1.22 m * pi/180 = 3.858 deg per deg of psi
#   k_head contributes                                   2.024 deg per deg of psi
#
#                                            | straight-line response
#   Before the D5 fix (heading term subtracting) | 3.858 - 2.024 = 1.834
#   After the D5 fix (heading term reinforcing)  | 3.858 + 2.024 = 5.882
#
# That is a 3.21x increase in straight-line steering authority. Start the
# first bench run slow. If it oscillates, scaling BOTH k_lat and k_head down
# together by 0.312 reproduces the net straight-line authority the ROS 2
# rover actually exhibited -- so [0.312x, 1.0x] is the bracket to search,
# not a recommendation to jump to either end. Note 0.312x also cuts the
# pure-lateral (b-only) response to 31%, which was never wrong, so it is a
# floor to search down to, not a target to aim for.

[control.lqr]
# Phase 2. Solved from the shared model in rover-model at startup, per speed
# bin, because A depends on v. Weights only; gains are derived, never pasted.
q_cross_track = 1.0
q_heading     = 1.0
r_steer       = 1.0

[control.mpc]
# Phase 3. Condensed to a box-constrained QP in `horizon` variables.
horizon       = 10
q_cross_track = 1.0
q_heading     = 1.0
r_steer       = 1.0
r_steer_rate  = 1.0

# ---------------------------------------------------------------------------
# Speed loop. Field-derived on this rover: it cruises at 15-16% duty and cannot
# climb the ramp below ~11%.
# ---------------------------------------------------------------------------
[speed]
reference_mps         = 0.20
kp                    = 0.3
ki                    = 0.5
kd                    = 0.0
integral_limit        = 100.0
max_duty_step_pct     = 15.0
limit_cap_pct         = 40.0   # hard ceiling, independent of any controller
sensor_timeout_s      = 1.0

[speed.autocal]
enabled        = true
min_duty_pct   = 13.0          # under the cruise band, above the dead zone
min_samples    = 40
window_s       = 60.0

[speed.stall]
enabled            = true
min_duty_pct       = 30.0      # well past what terrain needs; blocked, not loaded
min_ticks_per_sec  = 10.0
timeout_s          = 2.0

# ---------------------------------------------------------------------------
# State estimator. Q/R are starting points only.
#
# Seed measurement noise from recorded data: park the rover facing a straight
# line and take the variance of the lane parameters over a few hundred frames.
# No such recording exists yet -- no ROS 2 runs/ CSVs exist in this repository
# and none ever did. A run must be produced first before R can be seeded this
# way. See docs/STATUS_OPEN.md §1.1.
# ---------------------------------------------------------------------------
[estimator]
predict_hz            = 100.0
nis_gate              = 11.34  # chi-square, 3 DoF, 99%
lane_stale_ms         = 500
use_magnetometer      = false  # see §2.5 — motors distort it under load

# Largest per-sample tick delta on either wheel still counted as "stationary"
# for the zero-rate gyro-bias update. Start at 0; raise only if bench data
# shows a resting encoder dithering on electrical noise. A stray tick must not
# suppress bias estimation for a whole stop — bias observability is what bounds
# how long the rover can coast on a lost lane.
zero_rate_max_ticks = 0

# Process noise, as a continuous-time spectral density PER SECOND.
# The filter applies P += Q*dt, not P += Q, because predict is driven by IMU
# packet arrival rather than a hardware timer: dt jitters, and a dropped packet
# makes it several times nominal. Per-tick noise would leave the filter
# overconfident exactly when it has least information.
[estimator.q]
cross_track  = 1e-2
heading      = 1e-2
curvature    = 1e-1
speed        = 1e-1
gyro_bias    = 1e-5

[estimator.r]                  # measurement noise — MEASURE, do not guess
lane_cross_track = 2.5e-3
lane_heading     = 2.0e-3
lane_curvature   = 1.0e-2
odom_speed       = 1.0e-3
# Gyro noise for the zero-rate bias update, (rad/s)^2. Seed from the
# LSM6DSV16X datasheet noise density at the sample rate, then refine from a
# stationary bench log — a minute of the rover sitting still measures it
# directly, including whatever the chassis contributes.
zero_rate_gyro   = 1e-6

# ---------------------------------------------------------------------------
# Firmware safety. See docs/RUST_REWRITE_PLAN.md §5.2.
#
# The ROS 2 firmware had NO watchdog: if the RPi died mid-drive, the STM32 held
# its last PWM indefinitely.
# ---------------------------------------------------------------------------
[safety]
command_rate_hz       = 50
command_timeout_ms    = 200    # 10 missed frames
throttle_ramp_ms      = 300    # ramp to zero, not a step into a loaded drivetrain
iwdg_timeout_ms       = 500    # independent watchdog: catches hung firmware

# ---------------------------------------------------------------------------
# Mission. Goals may be pre-loaded here and armed before departure — the rover
# must be able to complete a mission with no uplink at all.
# ---------------------------------------------------------------------------
[mission]
arrival_radius_m     = 2.0
preloaded_goal       = []      # [lat, lon], empty = wait for a CommandFrame
