# Deliberately not a member of the root workspace: this crate builds for
# thumbv7em-none-eabihf while the workspace builds for the host, and cargo
# supports only one default target per workspace. The empty table opts out.
# (Same reasoning as firmware/chassis/Cargo.toml.)
[workspace]

[package]
name        = "sensors-fw"
description = "STM32F767ZI firmware: wheel quadrature encoders, INA226 power monitor, mirror link watchdog."
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
publish     = false

# Not a workspace member: see the root Cargo.toml's module comment and
# firmware/chassis/Cargo.toml's identical note. Depends on rover-msgs by path
# rather than `workspace = true`.
[dependencies]
rover-msgs = { path = "../../crates/rover-msgs", default-features = false }

# --- Embassy async runtime -------------------------------------------------
# Versions pinned exactly, identically to firmware/chassis and for the same
# reason given there: a firmware image is not the place to float on semver
# and discover a breaking change during a field bring-up session. Keep these
# in lockstep with chassis's Cargo.toml — two boards on the same bus running
# different embassy-net patch versions is not a combination worth debugging.
embassy-executor = { version = "=0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread"] }
embassy-time     = { version = "=0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync     = { version = "=0.8.0", features = ["defmt"] }
embassy-futures  = { version = "=0.1.2" }

# embassy-net: UDP only (rev 2 dropped TCP everywhere, see plan §4.2), static
# IP only (no DHCP - closed LAN, fixed routing table in config/rover.toml).
embassy-net = { version = "=0.9.1", features = ["defmt", "udp", "medium-ethernet", "proto-ipv4"] }

# embassy-stm32: `stm32f767zi` is the real die on the Nucleo board (same part
# chassis targets — both boards are the same Nucleo-144). `time-driver-tim5`:
# this board has no PWM at all (no motors, no servo), so TIM5 has no
# peripheral to collide with here; pinned anyway to match chassis rather than
# leave the two firmware images relying on embassy's default preference order
# for no reason. `exti` is load-bearing here in a way it isn't for
# chassis: the wheel encoders are read via GPIO edge interrupts, not timer
# hardware encoder mode — see src/encoders.rs for why that mode turned out to
# be physically unavailable on this board's pin assignment. `unstable-pac`:
# without it, `embassy_stm32::pac` is `pub(crate)` inside embassy-stm32 itself
# and unreachable from here at all; board self-diagnostics (`diag.rs`,
# `net.rs`'s `Lan8742a`) read `RCC_CSR` and raw PHY-adjacent registers
# directly, neither of which embassy-stm32's safe HAL exposes an accessor
# for. "unstable" describes the PAC's own API-stability guarantee
# (stm32-metapac's register layout can change across embassy-stm32 versions
# without a semver bump on embassy-stm32 itself), not a claim that reading a
# register is unsafe or unreliable - the version is pinned exactly (`=0.6.0`)
# precisely so that risk is fixed for the life of this Cargo.lock.
embassy-stm32 = { version = "=0.6.0", default-features = false, features = [
    "defmt",
    "stm32f767zi",
    "memory-x",
    "time-driver-tim5",
    "single-bank",
    "exti",
    "unstable-pac",
] }

# --- Boot / panic / logging -------------------------------------------------
cortex-m     = { version = "=0.7.9", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt  = { version = "=0.7.6" }
defmt        = { version = "=1.1.1" }
defmt-rtt    = { version = "=1.3.0" }
panic-probe  = { version = "=1.0.0", features = ["print-defmt"] }

# --- Misc no_std helpers -----------------------------------------------------
# Pinned for the same reason as chassis's identical block: `embedded-hal` in
# particular must resolve to exactly one version across the whole dependency
# graph, or the `embedded_hal::i2c::I2c` impl embassy-stm32 provides and the
# one the `ina226` driver expects would be two incompatible types with the
# same name, and the crate would fail to compile with a confusing trait-bound
# error rather than a version-conflict error.
static_cell       = { version = "=2.1.1" }
embedded-hal      = { version = "=1.0.0" }

# --- Sensor drivers ----------------------------------------------------------
# INA226 power monitor, per the plan §5.1's own recommendation. Unlike
# lsm6dsv16x-rs / lis2mdl-rs (see firmware/chassis/Cargo.toml's cautionary
# note about `bisync` being yanked), 0.3.0 of this crate resolves cleanly:
# plain embedded-hal 1.0 trait, no async-split proc-macro dependency chain,
# no yanked transitive crate. Checked by hand against its resolved dependency
# tree at this exact version before pinning.
ina226 = { version = "=0.3.0" }

[features]
default = []
# 1 Hz defmt/RTT tick-count readout for bench drivetrain calibration (plan
# §2.6 Procedure A). Default OFF, but not because leaving it on would be
# unsafe: checked against the vendored source of `defmt-rtt` (pinned
# `=1.3.0` above, see `defmt-rtt-1.3.0/src/{lib,channel}.rs`), its RTT
# channel boots in non-blocking/trim mode and stays there unless a debug
# host (`probe-rs`) actually attaches and latches it to blocking — so on the
# field image, which never has a debug host attached, a full buffer is just
# overwritten, never spun on. This feature is off by default to keep that
# field image byte-identical to today's and its log free of a 1 Hz line
# nobody in the field reads, not to dodge a hang. See
# `encoders::calibration_task`'s doc comment for the full finding, including
# the one case defmt-rtt's own docs *do* warn about (a host attaches, then
# disconnects mid-run) — a bench-only concern, since it requires a debug
# session to begin with.
calibration = []

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
debug         = 2
panic         = "abort"
